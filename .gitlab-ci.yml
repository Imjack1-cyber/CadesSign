# Pre-existing project security scanning - do not remove.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # Corporate proxy. The URL itself lives in the group-level CODE_PROXY
  # variable and is never hard-coded here.
  http_proxy: "$CODE_PROXY"
  https_proxy: "$CODE_PROXY"
  no_proxy: "$CODE_NO_PROXY,localhost,127.0.0.1,.siemens.de,.siemens.net,.siemens.com,.siemens.io"
  HTTP_PROXY: "$CODE_PROXY"
  HTTPS_PROXY: "$CODE_PROXY"
  NO_PROXY: "$CODE_NO_PROXY,localhost,127.0.0.1,.siemens.de,.siemens.net,.siemens.com,.siemens.io"

  # pom.xml sets <maven.compiler.release>21</maven.compiler.release> and the
  # release targets Java 21, so CI builds and tests on the same JDK.
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-21"

  # GitLab only caches paths inside $CI_PROJECT_DIR, so the local Maven
  # repository is relocated there.
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version --no-transfer-progress"

  # Coverage (JaCoCo, minimum in pom.xml) and SpotBugs run inside
  # `mvn verify`, so local builds enforce the same gates as CI.
  DEPCHECK_VERSION: "12.1.3"
  JAVADOC_VERSION: "3.12.0"
  NODE_IMAGE: "node:22"

  SECRET_DETECTION_ENABLED: "true"

  # Security templates gate on $CI_COMMIT_BRANCH, unset in MR pipelines.
  # Without this they only scan after merge, not on the merge request.
  AST_ENABLE_MR_PIPELINES: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Releases: tags v1.2.3
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - build
  - test
  - secret-detection
  - package
  - report
  - deploy
  - release

sast:
  stage: test

# needs: [] decouples this from the test stage. Without it the scan queues
# behind vulnerability-check, whose unkeyed NVD download can take >10 min.
secret_detection:
  stage: secret-detection
  needs: []

# ---------------------------------------------------------------------------
# Shared templates
# ---------------------------------------------------------------------------

# Maven does not read http_proxy/HTTPS_PROXY from the environment — it needs
# either a settings.xml or JVM system properties. CODE_PROXY is parsed into a
# generated settings.xml so every job inherits the proxy consistently.
.maven:
  image:
    name: $MAVEN_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.m2"
    - |
      if [ -n "$CODE_PROXY" ]; then
        PROXY_HOST=$(printf '%s' "$CODE_PROXY" | sed -E 's#^[a-zA-Z]+://##; s#^.*@##; s#[:/].*$##')
        PROXY_PORT=$(printf '%s' "$CODE_PROXY" | sed -E 's#^[a-zA-Z]+://##; s#^.*@##; s#^[^:]*:?##; s#/.*$##')
        [ -n "$PROXY_PORT" ] || PROXY_PORT=8080
        NON_PROXY=$(printf '%s' "localhost|127.0.0.1|*.siemens.de|*.siemens.net|*.siemens.com|*.siemens.io")
        cat > "$CI_PROJECT_DIR/.m2/settings.xml" <<EOF
      <settings>
        <proxies>
          <proxy>
            <id>corporate-http</id><active>true</active><protocol>http</protocol>
            <host>${PROXY_HOST}</host><port>${PROXY_PORT}</port>
            <nonProxyHosts>${NON_PROXY}</nonProxyHosts>
          </proxy>
          <proxy>
            <id>corporate-https</id><active>true</active><protocol>https</protocol>
            <host>${PROXY_HOST}</host><port>${PROXY_PORT}</port>
            <nonProxyHosts>${NON_PROXY}</nonProxyHosts>
          </proxy>
        </proxies>
      </settings>
      EOF
        echo "Maven proxy configured: ${PROXY_HOST}:${PROXY_PORT}"
      else
        printf '<settings/>\n' > "$CI_PROJECT_DIR/.m2/settings.xml"
        echo "CODE_PROXY unset - no Maven proxy configured"
      fi
    - export MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS --settings $CI_PROJECT_DIR/.m2/settings.xml"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/
    policy: pull
  tags:
    - DOCKER

# ---------------------------------------------------------------------------
# build - development compile, warms the dependency cache
# ---------------------------------------------------------------------------

build:dev:
  extends: .maven
  stage: build
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/
    policy: pull-push
  script:
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - target/
      - .m2/repository/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# test - unit, integration, coverage, vulnerabilities (all parallel)
# ---------------------------------------------------------------------------

# Everything `mvn verify` runs: unit tests, integration tests (online
# TSA/OCSP/CRL on loopback, SoftHSM2 PKCS#11 token, EU trusted lists, the
# shaded jar as a process), the coverage gate and SpotBugs.
test:verify:
  extends: .maven
  stage: test
  needs:
    - job: build:dev
      artifacts: true
  script:
    # SoftHSM2 lets Pkcs11IT sign with a real PKCS#11 token; without it the
    # PKCS#11 tests are skipped and coverage drops.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends softhsm2 > /dev/null
    - mvn $MAVEN_CLI_OPTS verify
    - mkdir -p coverage && cp -r target/site/jacoco/* coverage/
    - |
      awk -F, 'NR>1 {miss+=$8; cov+=$9} END {
        printf "Total line coverage: %.2f%%\n", cov * 100.0 / (miss + cov)
      }' coverage/jacoco.csv
  coverage: '/Total line coverage: ([0-9.]+)%/'
  artifacts:
    when: always
    paths:
      - coverage/
    expose_as: "Code Coverage Report"
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    expire_in: 30 days

# End-to-end exercise of the packaged CLI: signs every sample, verifies it,
# and asserts exit codes and the level reached (src/test/scripts/cli-smoke.sh).
test:integration:
  extends: .maven
  stage: test
  needs:
    - job: build:dev
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - sh src/test/scripts/cli-smoke.sh target/cades-lt.jar out
  artifacts:
    when: always
    paths:
      - out/
    expose_as: "Signed sample output"
    expire_in: 1 week

# Audits dependencies against the NVD and fails on CVSS >= 7. Without an
# NVD_API_KEY CI variable the NVD feed is aggressively rate-limited, so the
# job is advisory until a key is provisioned at group level.
vulnerability-check:
  extends: .maven
  stage: test
  needs:
    - job: build:dev
      artifacts: true
  rules:
    - if: $NVD_API_KEY
      allow_failure: false
    - when: on_success
      allow_failure: true
  timeout: 20 minutes
  script:
    - |
      NVD_OPTS=""
      if [ -n "$NVD_API_KEY" ]; then
        NVD_OPTS="-DnvdApiKey=$NVD_API_KEY"
        echo "Using provisioned NVD API key"
      else
        echo "WARNING: NVD_API_KEY is not set - NVD downloads are rate-limited."
      fi
      mvn $MAVEN_CLI_OPTS $NVD_OPTS \
        org.owasp:dependency-check-maven:${DEPCHECK_VERSION}:check \
        -DfailBuildOnCVSS=7 \
        -Dformats=HTML -Dformats=JSON
    - mkdir -p security && cp -r target/dependency-check-report.* security/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - security/
    expose_as: "Dependency Vulnerability Report"
    expire_in: 30 days

# The web app is a demo, but its tests and build must not rot.
test:frontend:
  image:
    name: $NODE_IMAGE
    entrypoint: [""]
  stage: test
  needs: []
  cache:
    key:
      files:
        - webapp/frontend/package-lock.json
    paths:
      - webapp/frontend/.npm/
  script:
    - cd webapp/frontend
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run typecheck
    - npx vitest run
    - npm run build
  tags:
    - DOCKER

# Nightly: the real EU LOTL and national lists still download and validate.
# Needs the LOTL signing certificates as a file-type CI variable LOTL_KEYSTORE
# (see docs/operations.md); set up a pipeline schedule to run it.
test:lotl-live:
  extends: .maven
  stage: test
  needs:
    - job: build:dev
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LOTL_KEYSTORE
  allow_failure: true
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - java -jar target/cades-lt.jar tl refresh --tl-cache tl-cache --lotl-keystore "$LOTL_KEYSTORE"
  artifacts:
    when: always
    paths:
      - tl-cache/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# package - production build
# ---------------------------------------------------------------------------

build:prod:
  extends: .maven
  stage: package
  needs:
    - job: build:dev
      artifacts: true
    - job: test:verify
      artifacts: false
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    # 'expose_as' rejects glob paths - stage the jar into a fixed directory.
    - mkdir -p dist && cp target/*.jar dist/
  artifacts:
    paths:
      - dist/
    expose_as: "Packaged JAR"
    expire_in: 30 days

# ---------------------------------------------------------------------------
# report - API documentation
# ---------------------------------------------------------------------------

docs:
  extends: .maven
  stage: report
  needs:
    - job: build:dev
      artifacts: true
  script:
    - >-
      mvn $MAVEN_CLI_OPTS
      org.apache.maven.plugins:maven-javadoc-plugin:${JAVADOC_VERSION}:javadoc
      -Dshow=private -Ddoclint=none
    - mkdir -p javadoc && cp -r target/reports/apidocs/* javadoc/ 2>/dev/null || cp -r target/site/apidocs/* javadoc/
  artifacts:
    paths:
      - javadoc/
    expose_as: "API Documentation"
    expire_in: 30 days

# ---------------------------------------------------------------------------
# deploy - GitLab Pages (MR preview + default branch)
# ---------------------------------------------------------------------------

.pages-content:
  image:
    name: alpine:latest
    entrypoint: [""]
  stage: deploy
  needs:
    - job: docs
      artifacts: true
    - job: test:verify
      artifacts: true
  script:
    - mkdir -p public/javadoc public/coverage
    - cp -r javadoc/* public/javadoc/
    - cp -r coverage/* public/coverage/
    - |
      cat > public/index.html <<'INDEXEOF'
      <!DOCTYPE html>
      <html lang="en">
        <head><meta charset="utf-8"><title>CAdES B-LT Demo - Reports</title></head>
        <body>
          <h1>CAdES B-LT Demo</h1>
          <ul>
            <li><a href="javadoc/">API Documentation</a></li>
            <li><a href="coverage/">Code Coverage</a></li>
          </ul>
        </body>
      </html>
      INDEXEOF
  artifacts:
    paths:
      - public/
  tags:
    - DOCKER

pages:deploy:
  extends: .pages-content
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
  environment:
    name: "pages/mr-$CI_MERGE_REQUEST_IID"
    url: "$CI_PAGES_URL/mr-$CI_MERGE_REQUEST_IID"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  extends: .pages-content
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# release - tags vX.Y.Z: versioned jar, distribution zip, checksums, SBOM
# ---------------------------------------------------------------------------

release:build:
  extends: .maven
  stage: package
  needs:
    - job: test:verify
      artifacts: false
    - job: test:integration
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - mvn $MAVEN_CLI_OPTS versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - mvn $MAVEN_CLI_OPTS org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=sbom
    - mkdir -p "release/cades-$VERSION"
    - cp target/cades-lt.jar src/main/scripts/cades src/main/scripts/cades.bat README.md "release/cades-$VERSION/"
    - cp -r docs "release/cades-$VERSION/"
    # Named after the tag so the release links below need no shell expansion.
    - cp target/cades-lt.jar "release/cades-lt-$CI_COMMIT_TAG.jar"
    - cp target/sbom.json "release/cades-lt-$CI_COMMIT_TAG.sbom.json"
    - (cd release && apt-get update -qq && apt-get install -y -qq zip > /dev/null && zip -qr "cades-$VERSION.zip" "cades-$VERSION")
    - (cd release && sha256sum "cades-lt-$CI_COMMIT_TAG.jar" "cades-$VERSION.zip" "cades-lt-$CI_COMMIT_TAG.sbom.json" > SHA256SUMS)
  artifacts:
    paths:
      - release/*.jar
      - release/*.zip
      - release/*.json
      - release/SHA256SUMS
    expire_in: never

release:publish:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
    - job: release:build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Publishing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "cades $CI_COMMIT_TAG"
    description: "Changes since the previous release: $CI_PROJECT_URL/-/commits/$CI_COMMIT_TAG"
    assets:
      links:
        - name: "cades-lt-${CI_COMMIT_TAG}.jar"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/release/cades-lt-$CI_COMMIT_TAG.jar?job=release:build"
        - name: "Distribution zip"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/release?job=release:build"
  tags:
    - DOCKER
